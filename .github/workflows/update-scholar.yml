name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 4 * * *"   # daily at 04:17 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Scholar metrics
        run: python scripts/update_scholar.py
        continue-on-error: true   # a blocked request should not fail the workflow

      - name: Sync new publications from ORCID
        run: python scripts/sync_publications.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@github.com"
          git add data/scholar.js data/publications.json data/publications.js
          git diff --cached --quiet || git commit -m "chore: refresh Scholar stats & sync publications"
          git push
